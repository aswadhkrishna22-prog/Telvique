name: Telvique CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache persistent debug keystore
        uses: actions/cache@v4
        with:
          path: .ci-keystore/debug.keystore
          key: telvique-debug-keystore-v2

      - name: Ensure persistent debug keystore exists
        run: |
          mkdir -p .ci-keystore
          if [ ! -f .ci-keystore/debug.keystore ]; then
            keytool -genkeypair -keystore .ci-keystore/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests, Lint & Build Debug APK
        run: ./gradlew :app:assembleDebug testDebugUnitTest lintDebug --stacktrace

      - name: Print Lint Report on Failure
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Telvique-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: Telvique-debug-apk
          path: Telvique-debug.apk
