name: Telvique CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests, Lint & Build Debug APK
        run: ./gradlew :app:assembleDebug testDebugUnitTest lintDebug --stacktrace

      - name: Print Lint Report on Failure
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Telvique-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: Telvique-debug-apk
          path: Telvique-debug.apk
